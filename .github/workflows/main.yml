name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: 2285
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p $SSH_PORT -T 10 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir archivos
        run: |
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude '.git' --exclude '.github' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/carlosestrchz.me/html/

      - name: Restaurar contexto SELinux
        run: ssh -p $SSH_PORT ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo restorecon -R /var/www/carlosestrchz.me"